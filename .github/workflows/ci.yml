name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      # Offline by design: the suite must never depend on numbeo.com being up,
      # or a green CI would mean "the site answered", not "the code is right".
      - name: Secret scan (verdict only — never prints a matching line)
        run: python tools/scan_secrets.py .
      # Both invocations, because they are not the same check. `-s tests`
      # without `-t .` cannot resolve the suite's relative imports and reports
      # a handful of errors against a suite of hundreds — a broken import,
      # wearing the shape of a small suite. Running both means neither can rot.
      - name: Unit tests (no network) — from the repo root
        run: python -m unittest discover -t . -s tests -v
      - name: Unit tests (no network) — top-level discovery
        run: python -m unittest discover -s . -p 'test_*.py' 
      - name: Packaging — build, install clean, run from outside the tree
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/venv/bin/citycost --version
          /tmp/venv/bin/citycost --help > /dev/null
          # Both entry points, from outside the tree. `-m` is the one a broken
          # PATH leaves a user with, and a module missing from the package is
          # invisible from inside the source tree — which is how it shipped
          # absent until 1.3.0.
          #
          # Reproducing this job locally: `rm -rf build/` first. setuptools
          # reuses `build/lib/`, so a file DELETED from the source is still
          # copied into the wheel from the previous build and the check passes
          # over an artefact that no longer matches the tree. CI never sees
          # this because it starts from a clean checkout; a developer does.
          # (`pip`'s wheel cache does the same thing one layer up — pass
          # `--no-cache-dir` if you build with pip rather than `build`.)
          /tmp/venv/bin/python -m citycost --version
          /tmp/venv/bin/python -m citycost --help > /dev/null
