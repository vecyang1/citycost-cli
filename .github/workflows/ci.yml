name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      # Offline by design: the suite must never depend on numbeo.com being up,
      # or a green CI would mean "the site answered", not "the code is right".
      - name: Secret scan (verdict only — never prints a matching line)
        run: python tools/scan_secrets.py .
      - name: Unit tests (no network)
        run: python -m unittest discover -s tests -v
      - name: Packaging — build, install clean, run from outside the tree
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/venv/bin/citycost --version
          /tmp/venv/bin/citycost --help > /dev/null
